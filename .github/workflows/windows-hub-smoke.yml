name: Windows Hub Update Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/hub-electron/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/windows-hub-smoke.yml'
  workflow_dispatch:
    inputs:
      fixtureVersion:
        description: 'Optional unpublished fixture version, e.g. 0.1.24; requires onlineTargetVersion'
        required: false
        type: string
      onlineTargetVersion:
        description: 'Published latest stable target; requires fixtureVersion or publishedSourceVersion'
        required: false
        type: string
      publishedSourceVersion:
        description: 'Test the actual published installer, e.g. 0.1.26, without rebuilding it'
        required: false
        type: string
  push:
    branches: [codex/windows-update-stock-fix]

permissions:
  contents: read

concurrency:
  group: windows-hub-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-update:
    runs-on: windows-latest
    timeout-minutes: ${{ inputs.fixtureVersion && 45 || 30 }}
    env:
      FIXTURE_VERSION: ${{ inputs.fixtureVersion || '' }}
      ONLINE_TARGET_VERSION: ${{ inputs.onlineTargetVersion || '' }}
      PUBLISHED_SOURCE_VERSION: ${{ inputs.publishedSourceVersion || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate Windows smoke script syntax
        shell: pwsh
        run: |
          $parseErrors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path apps/hub-electron/scripts/test-windows-update.ps1), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; throw 'Windows smoke script has syntax errors' }
      - name: Fresh native Windows release
        if: inputs.publishedSourceVersion == ''
        shell: pwsh
        run: |
          $version = (Get-Content apps/hub-electron/package.json | ConvertFrom-Json).version
          if ([bool]$env:FIXTURE_VERSION -ne [bool]$env:ONLINE_TARGET_VERSION) { throw 'Supply both online test versions or neither' }
          if ($env:FIXTURE_VERSION) {
            if ($env:FIXTURE_VERSION -notmatch '^\d+\.\d+\.\d+$' -or $env:ONLINE_TARGET_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Online test versions must be stable x.y.z versions' }
            if ([version]$env:FIXTURE_VERSION -ge [version]$env:ONLINE_TARGET_VERSION) { throw 'Internal fixture must be older than the public target' }
            if ($env:ONLINE_TARGET_VERSION -ne $version) { throw 'Public target must match the checked out source version' }
            $version = $env:FIXTURE_VERSION
            Write-Host "Building unpublished internal fixture $version; no release will be published"
          }
          pnpm release:hub:fresh -- --version $version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify previous release update and database preservation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./apps/hub-electron/scripts/test-windows-update.ps1 -FixtureVersion "$env:FIXTURE_VERSION" -OnlineTargetVersion "$env:ONLINE_TARGET_VERSION" -PublishedSourceVersion "$env:PUBLISHED_SOURCE_VERSION"
      - uses: actions/upload-artifact@v4
        if: always() && inputs.publishedSourceVersion == ''
        with:
          name: ${{ inputs.fixtureVersion && 'windows-hub-internal-fixture' || 'windows-hub-release' }}
          path: apps/hub-electron/release/*
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-update-smoke-logs
          path: |
            ${{ runner.temp }}/gpos-update-smoke/*.log
            ${{ runner.temp }}/gpos-update-smoke/*.json
            ${{ runner.temp }}/gpos-update-smoke/*.png
            ${{ runner.temp }}/gpos-update-smoke/updates/*.log
            ${{ runner.temp }}/gpos-update-smoke/updates/handoff-*/*.log
            ${{ runner.temp }}/gpos-update-smoke/updates/handoff-*/*.ps1
            ${{ runner.temp }}/gpos-update-smoke/updates/handoff-*/ready
            ${{ runner.temp }}/gpos-update-smoke/updates/handoff-*/decision
